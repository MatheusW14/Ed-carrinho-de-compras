<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">Gerenciamento de Produtos (Array)</h2>

    <div class="row justify-content-center">
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Cadastrar Produto</h5>
                </div>
                <div class="card-body">
                    <form id="form-produto">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Produto</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço (R$)</label>
                            <input type="number" class="form-control" id="preco" step="0.01" required>
                        </div>
                        <div class="mb-4">
                            <label for="quantidade" class="form-label">Quantidade em Estoque</label>
                            <input type="number" class="form-control" id="quantidade" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Cadastrar no Array</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="card-title mb-0">Produtos Cadastrados</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Preço</th>
                                    <th>Estoque</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-produtos">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Quando a página carregar, busca os itens que já estão no Array do backend
    document.addEventListener('DOMContentLoaded', carregarProdutos);

    // Função para buscar os produtos no backend (GET /produtos)
    async function carregarProdutos() {
        try {
            const resposta = await fetch('/produtos');
            const produtos = await resposta.json();
            
            const tbody = document.getElementById('tabela-produtos');
            tbody.innerHTML = ''; // Limpa a tabela antes de preencher

            if (produtos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Nenhum produto cadastrado no Array ainda.</td></tr>';
                return;
            }

            // Preenche a tabela com os dados vindos do Array em Python
            produtos.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.nome}</td>
                        <td>R$ ${p.preco.toFixed(2)}</td>
                        <td>${p.quantidade}</td>
                    </tr>
                `;
            });
        } catch (erro) {
            console.error("Erro ao carregar produtos:", erro);
        }
    }

    // Função para enviar os dados do formulário para o backend (POST /produtos)
    document.getElementById('form-produto').addEventListener('submit', async (e) => {
        e.preventDefault(); // Impede a página de recarregar
        
        const produto = {
            nome: document.getElementById('nome').value,
            preco: parseFloat(document.getElementById('preco').value),
            quantidade: parseInt(document.getElementById('quantidade').value)
        };

        try {
            const resposta = await fetch('/produtos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(produto)
            });

            if (resposta.ok) {
                document.getElementById('form-produto').reset(); // Limpa os campos
                carregarProdutos(); // Atualiza a tabela com o novo item do Array
            } else {
                alert("Erro ao cadastrar o produto.");
            }
        } catch (erro) {
            console.error("Erro ao cadastrar:", erro);
        }
    });
</script>

</body>
</html>
